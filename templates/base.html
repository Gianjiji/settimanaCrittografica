<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}La Settimana Crittografica{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16255A">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="testata">
  <div class="testata-riga">
    <a class="marchio" href="{{ url_for('issue_page', issue_id=current) }}">La Settimana Crittografica</a>
    <span class="prezzo">si risolve a mente</span>
  </div>
  <p class="occhiello">Vietata la calcolatrice. Matita consentita.</p>
  <nav class="menu">
    <a href="{{ url_for('issue_page', issue_id=current) }}">Fascicolo</a>
    <a href="{{ url_for('archive_page') }}">Arretrati</a>
    <a href="{{ url_for('stats_page') }}">Registro errori</a>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="chiusura">
  <p>Esercizi generati sui temi ricorrenti degli appelli di Crittografia. Ogni settimana un fascicolo nuovo.</p>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
